<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aa5b1"/>
      <stop offset="0.45" stop-color="#c3ccd6"/>
      <stop offset="1" stop-color="#7c8794"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a16"/>
      <stop offset="1" stop-color="#7a4a17"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6673"/>
      <stop offset="0.5" stop-color="#8b96a3"/>
      <stop offset="1" stop-color="#4a545f"/>
    </linearGradient>
    <pattern id="slats" width="800" height="26" patternUnits="userSpaceOnUse">
      <rect width="800" height="26" fill="url(#steel)"/>
      <rect width="800" height="3" y="0" fill="#ffffff" opacity="0.30"/>
      <rect width="800" height="4" y="22" fill="#20262d" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1d232a"/>
  <rect x="64" y="40" width="672" height="520" fill="url(#glow)"/>
  <rect x="120" y="330" width="180" height="130" rx="6" fill="#2a3138" opacity="0.75"/>
  <rect x="330" y="300" width="150" height="160" rx="6" fill="#2a3138" opacity="0.6"/>
  <rect x="510" y="345" width="170" height="115" rx="6" fill="#2a3138" opacity="0.7"/>

  <rect x="64" y="40" width="672" height="300" fill="url(#slats)"/>
  <rect x="64" y="330" width="672" height="18" fill="#d4611a"/>
  <rect x="64" y="40" width="672" height="300" fill="#000000" opacity="0.06"/>

  <rect x="46" y="40" width="26" height="520" fill="url(#rail)"/>
  <rect x="728" y="40" width="26" height="520" fill="url(#rail)"/>
  <rect x="46" y="20" width="708" height="26" rx="4" fill="#39414a"/>
  <rect x="46" y="552" width="708" height="14" fill="#141a20"/>
